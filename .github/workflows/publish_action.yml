# Publishes the node to the Comfy Registry (https://registry.comfy.org) whenever the
# version in pyproject.toml changes on main. Needs the repository secret
# REGISTRY_ACCESS_TOKEN (a Registry publishing API key) and a filled-in PublisherId.
# Template: https://docs.comfy.org/registry/publishing
name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
