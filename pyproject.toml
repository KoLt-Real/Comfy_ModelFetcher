[project]
name = "comfyui-modelfetcher"
description = "Top-bar button that reads a workflow's Markdown notes, downloads the models it needs into the right folder, and relinks loader nodes to copies you already own."
version = "1.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Nothing to install: only `requests` and `aiohttp`, both already required by ComfyUI.
dependencies = []

[project.urls]
Repository = "https://github.com/KoLt-Real/ComfyUI-ModelFetcher"

[tool.comfy]
DisplayName = "Model Fetcher"
# PublisherId comes from the account created on https://registry.comfy.org —
# fill it in before `comfy node publish`, it cannot be guessed.
# PublisherId = ""
